name: Build Android APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/brain.test.cjs
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Inspect package and collect signing tool
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: WhalePet-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tool
          path: signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-release.*
